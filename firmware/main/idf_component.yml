# Pinned third-party dependencies for the firmware build (AGENTS.md: "所有
# 外部依赖锁定版本"). lvgl/lvgl matches components/wisp_ui's LVGL 9.5.0 (see
# cmake/wisp_host_deps.cmake for the host-side pin); bblanchon/arduinojson
# matches components/wisp_base's host-side pin (cmake/wisp_host_deps.cmake).
# Board bring-up: esp_board_manager plus the CO5300 panel and
# CST9217 touch drivers its board YAML uses, and esp_lcd_touch (pulled in
# by those, but board.cpp/wisp_port_esp use its API directly). Each was
# first requested as the plan's range ("~0.7.5", "~2.2.0", "*") and then
# pinned to the exact version dependencies.lock resolved. Later tasks
# append further entries (e.g. the SD/audio driver components).
dependencies:
  idf: ">=6.0.3,<6.1"
  lvgl/lvgl: "9.5.0"
  bblanchon/arduinojson: "7.4.3"
  espressif/esp_board_manager: "0.7.5"
  espressif/esp_lcd_co5300: "2.2.0"
  espressif/esp_lcd_touch: "1.2.1"
  waveshare/esp_lcd_touch_cst9217: "2.0.0"
  # Backs wisp::port::esp::EspInternalStorage
  # (components/wisp_port_esp/dev/esp_storage.cpp) directly via
  # esp_vfs_littlefs_register() -- not a bmgr fs_littlefs device. First
  # requested as the plan's "~1.23.1" and then pinned to the exact version
  # dependencies.lock resolved.
  joltwallet/littlefs: "1.23.1"
  # esp_board_manager only depends on this conditionally (matches: if
  # CONFIG_ESP_BOARD_DEV_AUDIO_CODEC_SUPPORT == True), and that Kconfig
  # option isn't known yet on a from-scratch configure (before `idf.py
  # bmgr` has ever generated components/gen_bmgr_codes/'s Kconfig) --
  # same bootstrap issue esp_lcd_touch/esp_lcd_co5300 above avoid by being
  # direct, unconditional dependencies here rather than relying on
  # esp_board_manager's conditional pull. wisp::port::esp::EspAudioOut/
  # EspAudioIn (dev/esp_audio.cpp) use its esp_codec_dev.h API directly,
  # so it needs the same treatment. Pinned to the exact version
  # dependencies.lock already resolved transitively (THIRD_PARTY_NOTICES.md).
  espressif/esp_codec_dev: "2.0.0-beta5"
  # mDNS responder for wisp.local (wisp::port::esp::EspWifi,
  # components/wisp_port_esp/net/esp_wifi.cpp; connectivity spec 2.1).
  # Pinned to an exact release (THIRD_PARTY_NOTICES.md).
  espressif/mdns: "1.14.0"
