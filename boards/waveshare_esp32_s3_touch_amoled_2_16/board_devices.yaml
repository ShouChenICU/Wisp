# Adapted for Wisp from ESP-Claw's
# application/edge_agent/boards/waveshare/waveshare_ESP32_S3_Touch_AMOLED_2_16/board_devices.yaml
# (Apache-2.0, Copyright Espressif Systems -- see docs/references.md).
# Wisp change: the imu_sensor (QMI8658) and axp2101_power_manager (AXP2101)
# custom devices are removed -- Wisp brings those chips up with its own
# drivers (drivers/) on the shared i2c_master bus.
version: 1.0.0
# Devices Configuration for Waveshare ESP32-S3-Touch-AMOLED-2.16

devices:
  # ES8311 speaker playback path. Channel count/mask (1ch) and init gain
  # are no longer device-init config in esp_codec_dev 2.0 (dev_audio_codec
  # warns if the old dac_max_channel/dac_channel_mask/dac_init_gain keys
  # are present and ignores them) -- channel count/mask move to
  # esp_codec_dev_open()'s sample info, and gain moves to a post-open
  # esp_codec_dev_set_out_vol() call; both are done at runtime by
  # wisp::port::esp::EspAudioOut (components/wisp_port_esp/dev/esp_audio.cpp).
  # sys_cfg.no_mclk: false replaces the deprecated mclk_enabled: true (this
  # board's I2S config supplies an external MCLK on pin 42 -- see
  # board_peripherals.yaml's i2s_audio_out/i2s_audio_in).
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      sys_cfg:
        is_master: false
        no_mclk: false
    peripherals:
      - pa_name: gpio_pa_control
        active_level: 1
      - i2s_name: i2s_audio_out
      - i2c_name: i2c_master
        address: 0x30
        frequency: 400000

  # ES7210 dual microphone capture path. Channel count/mask (2ch, the two
  # wired mics) move to esp_codec_dev_open()'s sample info and init gain
  # to a post-open esp_codec_dev_set_in_gain() call, both done at runtime
  # by wisp::port::esp::EspAudioIn (same file as EspAudioOut above) -- see
  # that device's comment for why 2 physical channels downmixed to mono.
  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      dac_enabled: false
      sys_cfg:
        is_master: false
        no_mclk: false
    peripherals:
      - i2s_name: i2s_audio_in
      - i2c_name: i2c_master
        address: 0x80
        frequency: 400000

  # Optional microSD slot, wired as 1-bit SDMMC in Waveshare's ESP-IDF BSP.
  # mount_point is spec 7.1's "/sd" (defaults to "/sdcard" if omitted) --
  # wisp::port::esp::EspSdStorage (components/wisp_port_esp/dev/esp_storage.cpp)
  # reports this same path as storage.sd's mount_point().
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      mount_point: "/sd"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
      sub_config:
        bus_width: 1
        pins:
          clk: 2
          cmd: 1
          d0: 3

  # 2.16-inch 480x480 AMOLED, CO5300 over QSPI.
  - name: display_lcd
    chip: co5300
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      esp_lcd_co5300: "*"
      esp_lcd_panel_io_additions: "^1"
    config:
      x_max: 480
      y_max: 480
      swap_xy: true
      mirror_x: false
      mirror_y: true
      io_spi_config:
        cs_gpio_num: 12
        dc_gpio_num: -1
        spi_mode: 0
        lcd_cmd_bits: 32
        flags:
          quad_mode: true
      lcd_panel_config:
        reset_gpio_num: 39
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        bits_per_pixel: 16
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        vendor_config: NULL
    peripherals:
      - name: spi_display

  # Capacitive touch controller used by Waveshare's official BSP.
  - name: lcd_touch
    chip: cst9217
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      waveshare/esp_lcd_touch_cst9217: "*"
    config:
      io_i2c_config:
        scl_speed_hz: 400000
      touch_config:
        x_max: 480
        y_max: 480
        rst_gpio_num: 40
        int_gpio_num: 11
    peripherals:
      - name: i2c_master
        i2c_addr: [0xB4]
