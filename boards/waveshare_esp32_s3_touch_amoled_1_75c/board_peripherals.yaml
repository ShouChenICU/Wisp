# Derived from boards/waveshare_esp32_s3_touch_amoled_2_16/board_peripherals.yaml
# (itself adapted from ESP-Claw, Apache-2.0, Copyright Espressif Systems --
# see docs/references.md). Pins from Waveshare's ESP-IDF BSP for this board
# (waveshare/esp32_s3_touch_amoled_1_75c 3.0.0,
# include/bsp/esp32_s3_touch_amoled_1_75c.h; Apache-2.0) -- see
# docs/hardware/waveshare_esp32_s3_touch_amoled_1_75c.md.
version: 1.0.0
# Peripherals Configuration for Waveshare ESP32-S3-Touch-AMOLED-1.75C

peripherals:
  # Shared I2C bus: touch, AXP2101 PMU, QMI8658 IMU, ES8311, ES7210 (and a
  # PCF85063 RTC, if fitted -- board.cpp probes for it).
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 15
        scl: 14

  # I2S port 0: ES8311 playback + ES7210 capture. MCLK is GPIO16 on this
  # board (GPIO42 on the 2.16).
  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config: &i2s0_config
      port: 0
      sample_rate_hz: 16000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: 16
        bclk: 9
        ws: 45
        dout: 8
        din: 10

  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config: *i2s0_config

  # CO5300 AMOLED QSPI display. max_transfer_sz is one full 466x466 RGB565
  # frame.
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 4
        data1_io_num: 5
        data2_io_num: 6
        data3_io_num: 7
        sclk_io_num: 38
        max_transfer_sz: 434312

  # ES8311 speaker power amplifier enable, active high, starting off: the
  # audio_dac device binds it as its pa_name, so esp_codec_dev switches it
  # with the codec, and starting it at 1 pops at boot (same as the 2.16).
  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 46
      mode: GPIO_MODE_OUTPUT
      default_level: 0
