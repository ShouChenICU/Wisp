name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A setup-python interpreter is not "externally managed" (PEP 668),
      # so pip can install into it directly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - name: Install pinned clang-format
        # ubuntu-latest's apt clang-format package is a much older
        # major version than the one this repo is formatted against,
        # and the two disagree on formatting enough that
        # --dry-run --Werror would spuriously fail here. Install the
        # exact pinned version from PyPI instead. tools/ci.sh's
        # CLANG_FORMAT_VERSION line is the single place that version
        # is recorded -- read it from there rather than duplicating
        # the literal in this workflow.
        run: |
          CLANG_FORMAT_VERSION="$(grep -m1 '^CLANG_FORMAT_VERSION=' tools/ci.sh | sed -E 's/^CLANG_FORMAT_VERSION="([^"]+)".*/\1/')"
          echo "Installing clang-format==${CLANG_FORMAT_VERSION} (pinned in tools/ci.sh)"
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
          clang-format --version
      - name: Run tools/ci.sh
        run: bash tools/ci.sh

  firmware:
    runs-on: ubuntu-latest
    # Pinned ESP-IDF v6.0.3 toolchain + Python env (see AGENTS.md
    # section 4's firmware build line). set-target runs first so
    # the component manager fetches esp_board_manager, whose idf.py
    # extension provides `idf.py bmgr`; bmgr then generates the
    # (gitignored) firmware/components/gen_bmgr_codes/ from
    # boards/waveshare_amoled_216/ before the build. Flashing/monitoring a
    # real board is never a CI step (left to a human with the hardware).
    container:
      image: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: idf.py set-target esp32s3 && idf.py bmgr && idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py bmgr -c ../boards -b waveshare_amoled_216
          idf.py build
      # set-target resolves dependencies before gen_bmgr_codes exists and
      # temporarily drops bmgr's entries from the lock file; the build
      # (after bmgr) restores them. The committed lock must match the
      # final state exactly -- fail if the build rewrote it.
      - name: dependencies.lock unchanged
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code firmware/dependencies.lock
